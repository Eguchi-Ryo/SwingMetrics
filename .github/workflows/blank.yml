name: AWS OIDC Deploy to EC2

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::634523057682:role/GitHubActions

      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_ID="i-02c361d97ea7cb006"

          COMMANDS='[
            "set -e",
            "git config --system --add safe.directory /home/ec2-user/SwingMetrics || true",
            "cd /home/ec2-user/SwingMetrics",
            "sudo -u ec2-user git pull origin main",
            "echo \"Deploy finished successfully!\""
          ]'

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=${COMMANDS}" \
            --query "Command.CommandId" \
            --output text)

          echo "Command sent: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
