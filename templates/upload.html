<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        #videoPlayer {
            width: 640px;
            height: 360px;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">Upload New Video</h1>
        <form action="/api/v1/swings/upload/" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required />
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Upload</button>
        </form>
        <video id="videoPlayer" controls></video>
        <div class="mt-4">
            <button onclick="playVideo()" class="bg-green-500 text-white px-4 py-2 mr-2">Play</button>
            <button onclick="pauseVideo()" class="bg-red-500 text-white px-4 py-2 mr-2">Pause</button>
            <button onclick="skipForward()" class="bg-blue-500 text-white px-4 py-2 mr-2">Skip Forward</button>
            <button onclick="skipBackward()" class="bg-yellow-500 text-white px-4 py-2">Skip Backward</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');

        function playVideo() {
            video.play();
        }

        function pauseVideo() {
            video.pause();
        }

        function skipForward() {
            video.currentTime += 5; // Skip forward by 5 seconds
        }

        function skipBackward() {
            video.currentTime -= 5; // Skip backward by 5 seconds
        }
    </script>
</body>
</html>
