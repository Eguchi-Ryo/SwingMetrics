<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        #videoPlayer {
            width: 640px;
            height: 360px;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">Analysis</h1>
        <video id="videoPlayer" controls></video>
        <div class="mt-4 flex justify-between items-center text-xs">
            <div class="flex items-center gap-2">
                <button onclick="togglePlayPause()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-bold">再生 / 停止</button>
                <button onclick="skipBackward()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg">◀ コマ戻し</button>
                <button onclick="skipForward()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg">コマ送り ▶</button>
                <label class="flex items-center gap-1.5 text-slate-300 ml-2 cursor-pointer">
                    <input type="checkbox" id="syncCheckbox" checked class="rounded accent-blue-500"> 2画面同期連動
                </label>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const syncCheckbox = document.getElementById('syncCheckbox');

        function togglePlayPause() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function skipBackward() {
            video.currentTime -= 5; // Skip backward by 5 seconds
        }

        function skipForward() {
            video.currentTime += 5; // Skip forward by 5 seconds
        }
    </script>
</body>
</html>
