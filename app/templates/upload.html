{% extends 'base.html' %}

{% block title %}SwingMetrics AI - 打撃解析新規登録{% endblock %}

{% block content %}
  <main class="page-main">
    <div class="page-header">
      <div>
        <h1>野球 打撃スイング動画アップロード</h1>
        <p>バッティング動画をアップロードしてください。AIが骨格運動学から打撃4大幾何学指標を自動算出します。</p>
      </div>
    </div>

    <section class="form-card">
      <form class="form-grid" method="post" action="{{ url_for('main.upload') }}" enctype="multipart/form-data">
        
        <div class="upload-dropzone" style="grid-column: 1 / -1;">
          <strong>打撃動画ファイルをドラッグ＆ドロップ</strong>
          <span>またはファイルを選択（MP4, MOV / 推奨: 60fps以上の横向き撮影）</span>
          <input id="video-file" name="file" type="file" accept="video/*" style="display: block; margin: 1rem auto 0;" required />
        </div>

        <div class="field">
          <label for="title">解析タイトル</label>
          <input id="title" name="title" type="text" value="打撃スイング解析" placeholder="例: レベルスイング軌道確認" />
        </div>

        <div class="field">
          <label for="angle">撮影画角 (アングル)</label>
          <select id="angle" name="angle">
            {% for angle in form_options.angles %}
              <option value="{{ angle }}">{{ angle }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="submit-row" style="grid-column: 1 / -1;">
          <button type="submit" class="primary-btn">AI打撃解析を開始 (YOLO-Pose)</button>
        </div>
      </form>
    </section>
  </main>
{% endblock %}
