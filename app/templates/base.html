<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SwingMetrics AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="app-body">
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-group">
          <a href="{{ url_for('main.index') }}" class="brand-mark-link">
            <div class="brand-mark">SM</div>
            <div class="brand-text">SwingMetrics <span>AI</span></div>
          </a>
        </div>
        <nav class="topnav" aria-label="メインナビゲーション">
          {% if not is_admin %}
            <a href="{{ url_for('main.dashboard') }}" {% if request.path == '/dashboard' %}class="is-active"{% endif %}>ダッシュボード</a>
            <a href="{{ url_for('main.upload') }}" {% if request.path == '/upload' %}class="is-active"{% endif %}>新規解析</a>
          {% endif %}
          <a href="{{ url_for('main.models') }}" {% if request.path == '/models' %}class="is-active"{% endif %}>お手本ライブラリ</a>
          {% if is_admin %}
            <form method="post" action="{{ url_for('main.admin_logout') }}" style="margin: 0;">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
              <button type="submit" style="padding: 0; border: 0; background: none; color: inherit; cursor: pointer; font: inherit;">管理者ログアウト</button>
            </form>
          {% elif current_username %}
            <span>{{ current_username }}</span>
            <form method="post" action="{{ url_for('main.user_logout') }}" style="margin: 0;">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
              <button type="submit" style="padding: 0; border: 0; background: none; color: inherit; cursor: pointer; font: inherit;">ログアウト</button>
            </form>
          {% else %}
            <span>ゲスト利用中</span>
            <a href="{{ url_for('main.user_login') }}" {% if request.path == '/login' %}class="is-active"{% endif %}>ログイン</a>
            <a href="{{ url_for('main.user_register') }}" {% if request.path == '/register' %}class="is-active"{% endif %}>アカウント登録</a>
          {% endif %}
        </nav>
      </header>

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
